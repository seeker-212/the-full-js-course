<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //-----Boolean and If Statement-----
      //---Boolean---
      //Boolean is simply just true or false
      console.log(3 > 5); //This will display false
      console.log(5 === 5);
      //always use === instead of == because the double qual sign does not differenciate between number and string
      console.log(5 == "5.00");
      //Whereas the triple equal sign
      console.log(5 === "5.00");

      //---If Statement---
      if (true) {
        console.log("hello");
      }
      //---if and else---
      if (false) {
        console.log("bye");
      } else {
        console.log("hello");
      }

      //Another Example
      if (15 >= 16) {
        console.log("You can drive");
      } else {
        console.log("You can't drive");
      }

      //---if, else if and else---
      if (15 >= 16) {
        console.log("You can drive");
      } else if (15 >= 14) {
        console.log("You are almost there");
      } else {
        console.log("you cannot drive yet");
      }

      //Truthy and Falsy Values
      

      /*
      ----------Switch Statement----------
      This statment work exactly as an if and else statement but different syntax

      E.g switch (expression {
              case x: 
                print
                break;

              case y:
                print
                break
      })


      ------Real world case------
      let x = '0'
      let text;

      switch (x) {
        case 0:
          text = 'off'
          break;
        case 1:
          text = 'on'
          break;
        default:
          text = 'no value'
      }
      */
    </script>
  </body>
</html>
