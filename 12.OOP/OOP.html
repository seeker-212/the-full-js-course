       /*
                 ------------ Pillars of OOP ------------
            1) Encapsulation
            2) Abstraction
            3) Inheritance
            4) Polymorphism

            ---- Encapsulation ----
            This is a concept of bundling data (properties) and methods (function) together within an object
            allowing the object to control access to its internal data and behaviour.

            In js we can achieve encapsulation by using closures to create private members
            E.g function Counter (){
                let _count = 0 // private variable

                this.increment = function() {
                    _count++
                }

                this.decrement = function() {
                    _count--
                }

                this.getCount = function() {
                    return _count
                }
            }

            const counter = new Counter()
            console.log(counter.getCount())
            counter.increment()
            console.log(counter.getCount())
            counter.decrement()
            console.log(counter.getCount())


            --------- Abstraction --------
            This is a process of simplifying complex system by breaking them down into smaller, manageable parts.
            In Js you can use abstract classes to define structure and then implement them in concrete object.

            Abstract class (provides a blueprint for subclasses)

            E.g class Animal{
                constructor(name){
                    this.name = name
                }

                //Abstract method (to be implemented by sub classes)
                makeSound() {
                    throw new Error('Method (makesound) must be implemented')
                }
            }

            class Dog extends Animal{
                constructor(name) {
                    super(name)
                }

                // Implementing the Abstract Method.
                makeSound() {
                    return 'woof!'
                }
            }

            //Concrete Sub Class
            class Cat extends Animal{
                constructor(name){
                    super(name)
                }

                // Implementing the Abstract Method.
                makeSound() {
                    return 'meow!'
                }
            }

            const dog = new Dog('tiger')
            console.log(dog.name)
            console.log(dog.makeSound())

            const cat= new Cat('pussy')
            console.log(dog.name)
            console.log(dog.makeSound())


            --------- Inheritance ---------

        enable codes reusing and the creation of hierarchical relationships between classes.

        -----ES5 way of writing Inheritance-----

        }

        //Method shared among all Animal instances
        Animal.prototype.makeSound = function() {
            return 'Unknown Sound'
        }

        //subclass constructor inheriting from Animal
        function(name) {
            Animal.call(this, name) // calls the superclass constructor which the Animal
        }

        //setupp prototype chain for Dog to inherit from Animal
        Dog.prototype = Object.create(Animal.prototype)

        subclass. This facilitates writing codes that work with different types of object in a generic way.

        In Js, polymorphism is typically achieved through the method overriding, where a subclass provides
        its own implementation of a method that is already defined in the parent class.

            }
