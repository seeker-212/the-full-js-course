            -------- Promises --------
        A promise is an object representing the eventual completion or failure of an asynchronous operation.
        This contain both the producing code and calls to the consuming code. it can be used to deal with 
        asynchronous operation in Javascript.
        --- A promise has this three States ---
            1) Pending
            2) Fulfilled / Resolved
            3) Rejected

            ---- Promise Constructor ----
            .then()
            .finally()
            .catch()

            --.then()--
        This method is used to handle the successful outcome of a promise in javascript. it takes 2 argument:
        (onFulfilled, onRejected)

            --.catch()--
        This method returns a promise and deals with the rejected case only.
