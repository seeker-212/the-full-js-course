        /*
                -----------GSAP------------
        GSAP allows you to effortlessly animate anything JS can touch. Delivering silky-smooth 
        performance and unmatched support so you can focus on the fun stuff.

        ////////////////////////////////////////////////////////////////////

              ----- TWEEN -----
        A GSAP tween is the core animation engine in GreenSock's powerful JavaScript library, 
        essentially a high-performance function that animates any numerical property of any JavaScript 
        object (like position, scale, opacity) from a start value to an end value over a specified duration, 
        creating smooth, intermediate "in-between" frames (hence "tween") with methods like gsap.to(), gsap.from(), 
        and gsap.fromTo() for controlling elements on web pages. 
        


        */
